plugins {
	id 'java'
	id 'jacoco'
	id 'checkstyle'
	id 'pmd'
	id 'com.github.spotbugs' version '6.5.13'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.ben-manes.versions' version '0.64.0'
}

group = 'com.silicaproxy'
version = '2.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// Override Spring Boot BOM versions flagged by SilicaProxy (PUBLIC_VULN)
ext['jsoup.version'] = '1.23.2'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'

	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.postgresql:postgresql'

	implementation 'org.jspecify:jspecify:1.0.1'

	// Similarity algorithms (Levenshtein, Jaro-Winkler, FuzzyScore)
	implementation 'org.apache.commons:commons-text:1.15.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.fasterxml.jackson.core:jackson-databind'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

	spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
}

spotbugs {
	toolVersion = '4.10.2'
	effort = 'max'
	reportLevel = 'medium'
	excludeFilter = file('config/spotbugs-exclude.xml')
	ignoreFailures = false
}
spotbugsMain {
	reports {
		xml { required = true }
		html { required = true }
	}
}
spotbugsTest { enabled = false }

checkstyle {
	toolVersion = '14.3.0'
	configFile = file('config/checkstyle.xml')
	ignoreFailures = false
	showViolations = true
}
checkstyleMain {
	reports {
		xml { required = true }
		html { required = true }
	}
}
checkstyleTest { enabled = false }

pmd {
	toolVersion = '7.25.0'
	ruleSetFiles = files('config/pmd-ruleset.xml')
	ignoreFailures = false
	consoleOutput = false
}
pmdMain {
	reports {
		xml { required = true }
		html { required = true }
	}
}
pmdTest { enabled = false }

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
	systemProperty 'spring.profiles.active', 'test'
	testLogging {
		events 'started', 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
		showStandardStreams = false
	}
}

jacocoTestReport {
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('bootJar') {
	archiveBaseName = 'packagenameguardian'
}

def isStableVersion = { String version ->
	def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { keyword -> version.toUpperCase().contains(keyword) }
	def stableRegex = /^[0-9,.v-]+(-r)?$/
	stableKeyword || (version ==~ stableRegex)
}

tasks.named('dependencyUpdates') {
	rejectVersionIf {
		!isStableVersion(it.candidate.version) && isStableVersion(it.currentVersion)
	}
}

// bootRun runs from class directories (no jar manifest), so hand the version to the banner explicitly.
tasks.named('bootRun') {
	systemProperty 'application.formatted-version', " (v${project.version})"
}
